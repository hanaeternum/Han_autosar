<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="Microsoft YaHei UI, Segoe UI, system-ui, sans-serif">
  <title>整车 CAN 网络管理拓扑</title>
  <desc>网关横跨 CAN_BODY 与 CAN_INFO 两个网段，各节点在网段上运行独立的 AUTOSAR CanNm 状态机</desc>
  <rect x="0" y="0" width="960" height="620" fill="#FFFFFF"/>

  <text x="36" y="44" font-size="22" font-weight="500" fill="#111827">整车 CAN 网络管理拓扑</text>
  <text x="36" y="72" font-size="13" fill="#6B7280">NM 报文 ID = 0x400 + NodeID ｜ DLC = 8 ｜ 每个 ECU 在各自网段上是彼此独立的 CanNm 实例</text>

  <line x1="106" y1="196" x2="926" y2="196" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <text x="924" y="182" font-size="14" font-weight="500" fill="#374151" text-anchor="end">CAN_BODY　500 kbps</text>

  <line x1="125" y1="196" x2="125" y2="256" stroke="#2563EB" stroke-width="2"/>
  <rect x="62" y="256" width="126" height="118" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="125" y="288" font-size="20" font-weight="500" fill="#1E3A8A" text-anchor="middle">GW</text>
  <text x="125" y="308" font-size="12" fill="#1E40AF" text-anchor="middle">网关（演示主角）</text>
  <text x="125" y="330" font-size="12" fill="#334155" text-anchor="middle">NodeID 0x10</text>
  <text x="125" y="348" font-size="11" fill="#64748B" text-anchor="middle">CAN ID 0x410</text>
  <text x="125" y="364" font-size="11" fill="#64748B" text-anchor="middle">双网段独立实例</text>
  <line x1="125" y1="374" x2="125" y2="436" stroke="#2563EB" stroke-width="2"/>

  <line x1="106" y1="436" x2="926" y2="436" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <text x="924" y="422" font-size="14" font-weight="500" fill="#374151" text-anchor="end">CAN_INFO　500 kbps</text>

  <line x1="420" y1="150" x2="420" y2="196" stroke="#94A3B8" stroke-width="2"/>
  <rect x="335" y="76" width="170" height="74" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="420" y="102" font-size="16" font-weight="500" fill="#111827" text-anchor="middle">BCM</text>
  <text x="420" y="122" font-size="11" fill="#6B7280" text-anchor="middle">车身控制器</text>
  <text x="420" y="140" font-size="11" fill="#64748B" text-anchor="middle">NodeID 0x20 ｜ 0x420</text>

  <line x1="700" y1="150" x2="700" y2="196" stroke="#F59E0B" stroke-width="2"/>
  <rect x="615" y="76" width="170" height="74" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="700" y="102" font-size="16" font-weight="500" fill="#92400E" text-anchor="middle">PEPS</text>
  <text x="700" y="122" font-size="11" fill="#B45309" text-anchor="middle">无钥匙进入/启动</text>
  <text x="700" y="140" font-size="11" fill="#B45309" text-anchor="middle">NodeID 0x30 ｜ 0x430 ｜ 唤醒源</text>

  <line x1="420" y1="436" x2="420" y2="482" stroke="#94A3B8" stroke-width="2"/>
  <rect x="335" y="482" width="170" height="74" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="420" y="508" font-size="16" font-weight="500" fill="#111827" text-anchor="middle">IC</text>
  <text x="420" y="528" font-size="11" fill="#6B7280" text-anchor="middle">组合仪表</text>
  <text x="420" y="546" font-size="11" fill="#64748B" text-anchor="middle">NodeID 0x40 ｜ 0x440</text>

  <line x1="700" y1="436" x2="700" y2="482" stroke="#94A3B8" stroke-width="2"/>
  <rect x="615" y="482" width="170" height="74" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="700" y="508" font-size="16" font-weight="500" fill="#111827" text-anchor="middle">IVI</text>
  <text x="700" y="528" font-size="11" fill="#6B7280" text-anchor="middle">车载娱乐主机</text>
  <text x="700" y="546" font-size="11" fill="#64748B" text-anchor="middle">NodeID 0x50 ｜ 0x450</text>

  <rect x="45" y="466" width="252" height="96" rx="10" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="171" y="490" font-size="13" font-weight="500" fill="#6D28D9" text-anchor="middle">应用层联动（不是 NM 路由）</text>
  <text x="171" y="512" font-size="11" fill="#5B21B6" text-anchor="middle">NM 报文不跨网段转发；网关在信息网</text>
  <text x="171" y="530" font-size="11" fill="#5B21B6" text-anchor="middle">是否发起 NM，由应用层显式调用</text>
  <text x="171" y="548" font-size="11" fill="#5B21B6" text-anchor="middle">NetworkRequest 决定</text>

  <line x1="36" y1="580" x2="924" y2="580" stroke="#E5E7EB" stroke-width="1"/>
  <text x="36" y="602" font-size="11" fill="#6B7280">琥珀色 = 主动唤醒源（KL15）　｜　蓝色 = 网关（两个网段各一个独立 NM 实例）　｜　灰色 = 被动唤醒节点　｜　拓扑定义见 config/network.json</text>
</svg>
